apiVersion: apps/v1
kind: Deployment
metadata: { name: auth-service }
spec:
  replicas: 1
  selector: { matchLabels: { app: auth-service } }
  template:
    metadata: { labels: { app: auth-service } }
    spec:
      containers:
        - name: auth-service
          image: asia-southeast1-docker.pkg.dev/miraz001/calculator-repo/auth-service:latest
          ports: [{ containerPort: 4001 }]
          env:
            - { name: PORT, value: "4001" }
            - { name: NODE_ENV, value: production }
            - { name: DB_HOST, value: postgres }
            - { name: DB_PORT, value: "5432" }
            - { name: DB_NAME, value: calculator_db }
            - { name: DB_USER, value: calculator_user }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: calculator-secrets, key: db-password } }
            - { name: REDIS_HOST, value: redis }
            - { name: REDIS_PORT, value: "6379" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: calculator-secrets, key: jwt-secret } }
            - { name: JWT_EXPIRES_IN, value: 7d }
---
apiVersion: v1
kind: Service
metadata: { name: auth-service }
spec:
  selector: { app: auth-service }
  ports: [{ port: 4001, targetPort: 4001 }]
---
